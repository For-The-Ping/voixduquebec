<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voix du Québec — Élections générales</title>
  <meta name="theme-color" content="#0B57D0" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script defer src="/vendor/chart.umd.js"></script>

  <!-- === SEO de base === -->
  <meta name="description" content="Plateforme citoyenne ouverte et transparente sur les intentions de vote au Québec. Une voix par personne. Pas plus." />
  <link rel="canonical" href="https://voixduquebec.ca/" />
  <meta http-equiv="Content-Language" content="fr-CA" />

  <!-- Favicons additionnels -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Voix du Québec" />
  <meta property="og:title" content="Voix du Québec — Élection provinciale" />
  <meta property="og:description" content="Plateforme citoyenne ouverte et transparente sur les intentions de vote au Québec. Une voix par personne. Pas plus." />
  <meta property="og:url" content="https://voixduquebec.ca/" />
  <meta property="og:image" content="https://voixduquebec.ca/og-image.jpg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Voix du Québec — Élection provinciale" />
  <meta name="twitter:description" content="Une voix par personne. Pas plus." />
  <meta name="twitter:image" content="https://voixduquebec.ca/og-image.jpg" />

  <!-- Google Search Console (optionnel) -->
  <!-- <meta name="google-site-verification" content="COLLER_CODE_VERIF" /> -->

  <!-- Données structurées JSON-LD -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@graph":[
      {
        "@type":"Organization",
        "name":"Voix du Québec",
        "url":"https://voixduquebec.ca/",
        "logo":"https://voixduquebec.ca/logo.png",
        "sameAs":[]
      },
      {
        "@type":"WebSite",
        "name":"Voix du Québec",
        "url":"https://voixduquebec.ca/",
        "potentialAction":{
          "@type":"SearchAction",
          "target":"https://voixduquebec.ca/recherche?q={query}",
          "query-input":"required name=query"
        }
      }
    ]
  }
  </script>

  <!-- (Optionnel) Cloudflare Turnstile ; laisse si utilisé -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

  <script defer src="/app.js"></script>
</head>

<body>
  <header class="md-appbar elevation-3">
    <div class="md-appbar__inner">
      <div class="md-brand">
        <img src="/favicon.png" alt="QC" class="qc-flag">
        <div class="md-brand__text">
          <div class="md-title">Voix du Québec</div>
          <div class="md-subtitle">Élections générales — <span class="election-date">5 octobre 2026</span></div>
        </div>
      </div>
    </div>
  </header>

  <h1 style="text-align:center; font-size:20px; margin-top:14px;">
    « Dans une démocratie, chaque citoyen a une voix, ni plus ni moins. »
  </h1>

  <main class="container">
    <section class="md-grid">
      <article class="md-card elevation-2 chart-card">
        <canvas id="chart" width="460" height="460"></canvas>
        <div id="center-label" class="center-label"></div>
      </article>

      <aside class="md-card elevation-2 vote-card">
        <form id="vote-form" class="form">
          <div id="candidate-list" class="candidate-list"></div>

          <!-- Bouton Voter -->
          <button type="submit" class="md-button md-button--filled ripple vote-btn">
            <span class="md-button__label">Voter</span>
          </button>

          <!-- Turnstile (optionnel, remplace SITE_KEY si tu l’utilises) -->
          <div class="cf-turnstile" data-sitekey="SITE_KEY" data-theme="auto" data-size="flexible"></div>

          <div class="push"></div>
          <p id="msg" class="caption muted"></p>
        </form>
      </aside>
    </section>

    <section class="md-card elevation-2 results-card">
      <h2 class="section-title">Résultats en direct</h2>
      <div id="results-table"></div>
    </section>
  </main>

  <footer class="footer">
    <p class="caption muted">
      Voix du Québec est un projet citoyen libre, publié sous licence MIT et accessible sur
      <a href="https://github.com/For-The-Ping/voixduquebec" target="_blank">GitHub</a>.
    </p>
    <p class="footer-contact">
      <a href="mailto:contact@voixduquebec.ca">contact@voixduquebec.ca</a>
    </p>
  </footer>
</body>
</html>
